name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  database-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build project PostgreSQL/PostGIS image
        run: docker build -f db/Dockerfile -t kartaspb-ci-db .
      - name: Start database runtime
        run: >-
          docker run -d --name kartaspb-ci-db
          -e POSTGRES_DB=kartaspb
          -e POSTGRES_USER=kartaspb
          -e POSTGRES_PASSWORD=test-password
          --health-cmd='pg_isready -U kartaspb -d kartaspb'
          --health-interval=2s --health-timeout=2s --health-retries=30
          kartaspb-ci-db
      - name: Wait for database health
        run: |
          for attempt in $(seq 1 30); do
            [ "$(docker inspect kartaspb-ci-db --format '{{.State.Health.Status}}')" = healthy ] && exit 0
            sleep 2
          done
          docker logs kartaspb-ci-db
          exit 1
      - name: Verify native runtime architecture
        run: ./scripts/check-db-architecture.sh kartaspb-ci-db
      - name: Verify PostgreSQL and PostGIS
        run: |
          docker exec kartaspb-ci-db psql -U kartaspb -d kartaspb -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION postgis' \
            -c 'SELECT version(), PostGIS_Full_Version()'

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: kartaspb_test
          POSTGRES_USER: kartaspb
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kartaspb -d kartaspb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://kartaspb:test-password@localhost:5432/kartaspb_test
      TEST_DATABASE_URL: postgresql+psycopg://kartaspb:test-password@localhost:5432/kartaspb_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run migrations
        run: alembic -c alembic.ini upgrade head
      - name: Verify model and migration parity
        run: alembic -c alembic.ini check
      - name: Lint
        run: ruff check app tests ../migrations
      - name: Typecheck
        run: mypy app
      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  ingest-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned OSM tooling
        run: docker compose build ingest
      - name: Report OSM tooling versions
        run: docker compose run --rm --no-deps ingest versions
