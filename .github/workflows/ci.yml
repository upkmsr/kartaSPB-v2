name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: kartaspb_test
          POSTGRES_USER: kartaspb
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kartaspb -d kartaspb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://kartaspb:test-password@localhost:5432/kartaspb_test
      TEST_DATABASE_URL: postgresql+psycopg://kartaspb:test-password@localhost:5432/kartaspb_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run migrations
        run: alembic -c alembic.ini upgrade head
      - name: Verify model and migration parity
        run: alembic -c alembic.ini check
      - name: Lint
        run: ruff check app tests ../migrations
      - name: Typecheck
        run: mypy app
      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  ingest-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned OSM tooling
        run: docker compose build ingest
      - name: Report OSM tooling versions
        run: docker compose run --rm --no-deps ingest versions
